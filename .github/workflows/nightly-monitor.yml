name: nightly monitor

# The scheduled job this project exists to prove out: fetch the upstream extract,
# land it byte-faithfully, judge every check, and page only what the alert router
# decides is worth paging. One command per stage, so a bad night says which stage
# broke instead of failing somewhere inside a wrapper.
#
# Schedule: 06:00 UTC. That is 22:00 the previous evening in Dallas (America/
# Chicago), after the agency's US day has closed, and 11:30 in New Delhi - the
# engineer sees the result at the start of their own morning.
#
# This job deliberately does NOT fail when checks fail. A monitor whose badge goes
# red every night gets ignored by everyone; the finding is the payload, and routing
# decides what escalates. The job fails only when the pipeline itself broke - a
# checksum mismatch, a landing error, or a check that raised instead of judging.
#
# What never leaves the runner: `raw.*` and `stg.*` hold JTH rows, third-party
# personal data under CC BY-NC 4.0. Only the `dq.*` tables - the monitor's own
# findings - are uploaded as an artifact.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: Re-download the upstream files even if the cached copy verifies
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONITOR_DUCKDB: ${{ github.workspace }}/.monitor/monitor.duckdb
      # With no secrets configured the router falls back to the console transport
      # and the run still produces a readable alert in the job log. Setting these
      # in repo secrets switches Slack and email on - see monitor/transports/__init__.py.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DQ_SMTP_HOST: ${{ secrets.DQ_SMTP_HOST }}
      DQ_SMTP_PORT: ${{ secrets.DQ_SMTP_PORT }}
      DQ_SMTP_USER: ${{ secrets.DQ_SMTP_USER }}
      DQ_SMTP_PASSWORD: ${{ secrets.DQ_SMTP_PASSWORD }}
      DQ_ALERT_FROM: ${{ secrets.DQ_ALERT_FROM }}
      DQ_ALERT_TO: ${{ secrets.DQ_ALERT_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Prepare the run directory
        run: mkdir -p .monitor reports out

      # Keyed on etl/fetch.py because that is where the pinned sha256s live: change
      # a pin and the cache misses, so a stale file can never be judged as fresh.
      - name: Cache the upstream extract
        uses: actions/cache@v4
        with:
          path: data
          key: jth-${{ hashFiles('etl/fetch.py') }}

      - name: Fetch and verify checksums
        run: python etl/fetch.py ${{ github.event.inputs.refresh && '--refresh' || '' }}

      - name: Land into raw and stg
        run: python etl/load.py

      - name: Judge every check
        shell: bash
        # pipefail, because `cli.py run | tee` would otherwise report tee's exit
        # code and a monitor that crashed would look like a green night.
        run: set -o pipefail; python monitor/cli.py run | tee out/run.log

      - name: Incident state after this run
        if: always()
        run: |
          {
            echo "### run summary"
            echo '```'
            python monitor/cli.py summary
            echo '```'
            echo "### incidents"
            echo '```'
            python monitor/cli.py alerts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export the monitor's own tables only
        if: always()
        run: |
          python - <<'PY'
          import duckdb, os, pathlib
          out = pathlib.Path("out")
          con = duckdb.connect(os.environ["MONITOR_DUCKDB"], read_only=True)
          for table in ("runs", "results", "metrics", "baselines", "alerts"):
              con.execute(
                  f"copy dq.{table} to 'out/dq_{table}.csv' (format csv, header true)"
              )
              print(f"  dq.{table} -> out/dq_{table}.csv")
          con.close()
          PY

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dq-state
          path: |
            out/dq_runs.csv
            out/dq_results.csv
            out/dq_metrics.csv
            out/dq_baselines.csv
            out/dq_alerts.csv
            out/run.log
          retention-days: 30

      - name: Fail the schedule only when the pipeline itself broke
        run: |
          python - <<'PY'
          import duckdb, os, sys
          con = duckdb.connect(os.environ["MONITOR_DUCKDB"], read_only=True)
          run = con.execute(
              "select run_id, checks_total, errored from dq.runs order by started_at desc limit 1"
          ).fetchone()
          con.close()
          if run is None:
              print("no run row was written - the monitor did not complete")
              raise SystemExit(1)
          run_id, checks_total, errored = run
          print(f"latest run {run_id}: {checks_total} checks, {errored} errored")
          if errored:
              print(f"{errored} check(s) raised instead of judging; a check that cannot "
                    "run is not a pass and is not a finding - it is an outage")
              raise SystemExit(1)
          PY
