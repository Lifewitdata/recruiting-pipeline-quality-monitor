name: monitor ci

# Everything here runs offline against the synthetic extract `etl/synthesize.py`
# generates, so the gate is free, deterministic, and cannot be broken by Zenodo
# being down. The real JTH files are third-party personal data under CC BY-NC 4.0
# and never enter this repository - `.github/workflows/nightly-monitor.yml` shows
# how the monitored run gets them on a schedule instead.
#
# Two things are asserted, not just run: that the fixture regenerates byte-for-byte,
# and that the check suite detects every fault the incident harness injects.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      # A throwaway database in the workspace: the monitor writes its own `dq`
      # schema and must never depend on a developer's local file being present.
      MONITOR_DUCKDB: ${{ github.workspace }}/.gate/ci.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -r requirements-dashboard.txt

      - name: Prepare the gate workspace
        run: mkdir -p .gate reports

      - name: Registry size
        run: |
          python monitor/cli.py list > .gate/registry.txt
          tail -1 .gate/registry.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Unit, transport and console tests
        run: python -m pytest -m "not incident" -rA

      - name: The synthetic fixture regenerates byte-for-byte
        run: |
          python etl/synthesize.py --out .gate/a
          python etl/synthesize.py --out .gate/b
          for table in candidates jobs history; do
            cmp .gate/a/$table.csv .gate/b/$table.csv
          done
          {
            echo "### fixture checksums"
            echo ""
            echo '```'
            (cd .gate/a && sha256sum *.csv)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Incident harness - measured detection, not a claim of coverage
        shell: bash
        # pipefail, because `incidents | tee` would otherwise report tee's exit code
        # and an undetected incident would sail through the gate.
        run: set -o pipefail; python -m monitor.incidents | tee .gate/incidents.log

      - name: Publish the detection score
        if: always()
        run: |
          python - <<'PY' > .gate/score.md
          import json, pathlib
          path = pathlib.Path("reports/incident_report.json")
          if not path.exists():
              print("### no incident report written")
              raise SystemExit(0)
          r = json.loads(path.read_text(encoding="utf-8"))
          control = r["control"]
          print("### what the suite measured")
          print("")
          print("| measure | value |")
          print("| --- | --- |")
          print(f"| incidents injected | {r['incidents']} |")
          print(f"| incidents fully attributed | {r['incidents_fully_detected']} |")
          print(f"| checks designed to fire | {r['checks_expected']} |")
          print(f"| checks that fired | {r['checks_detected']} ({r['detection_rate_pct']:g}%) |")
          print(f"| critical alerts routed | {r['criticals_paged']} across {r['incidents_that_paged']} incidents |")
          print(f"| silent critical incidents | {len(r['incidents_that_should_page_but_did_not'])} |")
          print(f"| over-eager paging | {len(r['incidents_that_should_not_page_but_did'])} |")
          print(f"| clean control runs | {control['runs']} ({control['findings']} findings, "
                f"{control['flapping_checks']} flapping) |")
          print(f"| false-positive rate | {control['false_positive_rate']:g} |")
          PY
          cat .gate/score.md >> "$GITHUB_STEP_SUMMARY"

      - name: Console pages over the report the harness just wrote
        shell: bash
        # The Detection page reads reports/incident_report.json, which does not exist
        # when the pytest step above runs. Its missing-report branch is covered there;
        # this re-runs the console tests now that the real report is on disk, so CI
        # exercises the populated branch too rather than only a developer's machine.
        run: python -m pytest tests/test_dashboard.py -m "not incident" -rA

      - name: Upload what the monitor measured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-evidence
          path: |
            reports/incident_report.json
            .gate/registry.txt
            .gate/incidents.log
